<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nyx — HUD</title>
<link rel="stylesheet" href="nui://nyx_lib/web/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Every element starts hidden and is revealed by a preference. A player
         who turns everything off gets a genuinely empty screen. -->

    <div class="hud-fps nyx-hidden" id="fps"></div>

    <div class="hud-money nyx-hidden" id="money"></div>

    <div class="hud-announce nyx-hidden" id="announce"></div>

    <div class="hud-crosshair nyx-hidden" id="crosshair"></div>

    <div class="hud-status nyx-hidden" id="status"></div>

    <div class="hud-vehicle nyx-hidden" id="vehicle"></div>

    <div class="hud-watermark nyx-hidden" id="watermark"></div>

    <div class="hud-voice nyx-hidden" id="voice"></div>

    <script src="nui://nyx_lib/web/nyx.js"></script>
    <script src="app.js"></script>
</body>
</html>
