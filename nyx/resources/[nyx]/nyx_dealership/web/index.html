<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nyx — dealership</title>
<link rel="stylesheet" href="nui://nyx_lib/web/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- No backdrop: the middle of the screen is the showroom itself, rendered
         by the game behind this page. -->
    <div class="shell nyx-hidden" id="shell">
        <aside class="nyx-panel side" id="side">
            <header class="side-head">
                <div class="nyx-row">
                    <span class="side-icon" id="titleIcon"></span>
                    <b id="title">Dealership</b>
                </div>
                <button class="nyx-btn nyx-btn--ghost side-close" id="closeBtn">Close</button>
            </header>

            <label class="nyx-field side-search">
                <span id="searchIcon"></span>
                <input type="text" id="search" placeholder="Search" maxlength="32" autocomplete="off">
            </label>

            <div class="side-list nyx-scroll" id="list"></div>
        </aside>

        <footer class="nyx-panel bar" id="bar"></footer>

        <div class="test-drive nyx-hidden" id="testDrive"></div>
    </div>

    <script src="nui://nyx_lib/web/nyx.js"></script>
    <script src="app.js"></script>
</body>
</html>
