# limine.conf - menu for the Limine boot loader (https://github.com/limine-bootloader/limine).
# SkarletOS uses the Multiboot 1 protocol, so the same kernel also boots with
# GRUB or QEMU's -kernel option.
timeout: 2

/SkarletOS
    comment: SkarletOS, a small UNIX-like system with a Plasma-style desktop
    protocol: multiboot1
    path: boot():/boot/skarletos.bin
