name: Build SkarletOS

on:
  # workflow_dispatch only appears in the Actions UI once this file is on the
  # default branch, so pushes that touch SkarletOS trigger a build as well.
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Publish skarletos/release/skarletos.iso as the GitHub release for the
          version in skarletos/src/vfs.c. Leave off to only build and test.
        type: boolean
        default: false
  push:
    branches:
      - 'main'
      - 'claude/**'
    paths:
      - 'skarletos/**'
      - '.github/workflows/build-skarletos.yml'
      # Screenshots and the logo come out of local runs; they need no rebuild.
      - '!skarletos/docs/**'

permissions:
  contents: write

concurrency:
  group: skarletos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and boot the ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: skarletos

    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU
        run: sudo apt-get update -q && sudo apt-get install -yq qemu-system-x86

      - name: Read the version
        id: meta
        run: |
          version=$(sed -n 's/.*VERSION=\\"\([0-9.]*\)\\".*/\1/p' src/vfs.c | head -1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "SkarletOS $version"

      - name: Build the kernel
        run: make

      # The desktop code on Linux under AddressSanitizer: 192 checks and
      # 40,000 random key presses.
      - name: Run the UI tests
        run: make test

      # Downloads the Limine boot loader (v11.4.1 binary release) and writes
      # the CD image with tools/mkiso.py.
      - name: Build the ISO from source
        run: make iso

      # BIOS boot with QEMU's VMware SVGA adapter: checks the 1918x1075 mode,
      # the login screen and the maroon launcher button. No KVM here, so
      # every wait is doubled.
      - name: Boot the freshly built ISO
        run: python3 tools/qemu_test.py --slow 2 --out build/qemu/fresh build/skarletos.iso

      - name: Boot the committed ISO (the one that gets published)
        run: python3 tools/qemu_test.py --slow 2 --out build/qemu/release release/skarletos.iso

      - name: Gather the release files
        run: |
          mkdir -p ../dist
          cp release/skarletos.iso release/LIMINE-LICENSE.txt ../dist/
          cp docs/logo/skarletos-logo.svg docs/logo/skarletos-logo-512.png ../dist/
          for s in 02-desktop 03-launcher 06-terminal 08-files 13-add-widgets 17-settings-light; do
            cp "docs/screenshots/$s.png" "../dist/screenshot-$s.png"
          done
          (cd ../dist && sha256sum skarletos.iso > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skarletos-${{ steps.meta.outputs.version }}
          path: |
            dist/
            skarletos/build/skarletos.iso
            skarletos/build/qemu/
          if-no-files-found: warn

      - name: Clear a stale release for this version
        if: inputs.publish || contains(github.event.head_commit.message, '[skarletos-release]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="skarletos-v${{ steps.meta.outputs.version }}"
          if gh release view "$tag" --json tagName > /dev/null 2>&1; then
            echo "removing existing release and tag $tag"
            gh release delete "$tag" --yes --cleanup-tag
          fi

      - name: Publish the release
        if: inputs.publish || contains(github.event.head_commit.message, '[skarletos-release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: skarletos-v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SkarletOS ${{ steps.meta.outputs.version }} (x86-64, bootable ISO)
          body_path: skarletos/RELEASE_NOTES.md
          files: dist/*
