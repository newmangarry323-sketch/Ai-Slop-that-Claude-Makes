name: Build Cadence.exe

on:
  # workflow_dispatch only appears in the Actions UI once this file is on the
  # default branch, so pushes to the working branches trigger a build as well.
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'claude/**'
    tags:
      - 'cadence-v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cadence

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: pip install --disable-pip-version-check pyinstaller

      - name: Sanity-check the source
        run: |
          python -c "import ast, pathlib; ast.parse(pathlib.Path('Cadence.py').read_text(encoding='utf-8')); print('parses clean')"
          python Cadence.py --version

      - name: Generate the icon
        run: python Cadence.py --write-icon Cadence.ico

      - name: Build the one-file executable
        run: >
          pyinstaller --onefile --noconsole
          --name Cadence
          --icon Cadence.ico
          --version-file version.txt
          Cadence.py

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          # --noconsole builds cannot print, so prove it runs by having it emit its icon.
          Start-Process -FilePath dist\Cadence.exe -ArgumentList '--write-png','probe.png' -Wait
          if (-not (Test-Path probe.png)) { throw 'Cadence.exe produced no output' }
          Write-Host "ok: exe ran and wrote $((Get-Item probe.png).Length) bytes"
          Get-Item dist\Cadence.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-windows
          path: |
            cadence/dist/Cadence.exe
            cadence/Cadence.ico
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/cadence-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Cadence ${{ github.ref_name }}
          files: |
            cadence/dist/Cadence.exe
            cadence/Cadence.ico
          body: |
            A music manager for a local library, with an interface modelled on
            VS Code. Point it at one folder; it indexes that folder and
            everything beneath it on every launch.

            ## Download

            **`Cadence.exe`** — self-contained, no Python needed. Windows 64-bit.

            Windows SmartScreen will warn on first run because the executable is
            not code-signed: choose **More info** then **Run anyway**.

            On first launch it asks you to pick your music folder. After that it
            rescans on every start, re-reading only the files whose size or
            timestamp changed, so start-up stays fast. You can also pass the
            folder directly:

            ```
            Cadence.exe --folder "D:\Music"
            ```

            It opens in a chromeless Chrome, Edge or Brave window, falling back
            to your default browser if none of those are installed.

            ## Also runs from source

            `cadence/Cadence.py` is the whole program — one file, standard
            library only, no `pip install`:

            ```
            python Cadence.py --folder "D:\Music"
            ```

            ## What it reads

            Tags are parsed in-process for MP3 (ID3v2.2/2.3/2.4 and ID3v1),
            FLAC, Ogg Vorbis, Opus, MP4/M4A, WAV and AIFF, including embedded
            cover art. Playback uses the browser's audio engine, which covers
            MP3, WAV, FLAC, M4A/AAC, Ogg and Opus.

            Your audio files are opened read-only — no tags written, nothing
            renamed or moved. The index and playlists live in `%APPDATA%\Cadence`.
