name: Build Cadence

on:
  # workflow_dispatch only appears in the Actions UI once this file is on the
  # default branch, so pushes to the working branches trigger a build as well.
  workflow_dispatch:
    inputs:
      republish:
        description: >-
          Delete and re-publish the release for the version currently in
          Cadence.py. Leave off to only build and check.
        type: boolean
        default: false
  push:
    branches:
      - 'main'
      - 'claude/**'
    tags:
      - 'cadence-v*'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
    defaults:
      run:
        working-directory: cadence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sanity-check the source
        shell: python
        run: |
          import ast, pathlib, re, sys

          source = pathlib.Path("Cadence.py").read_text(encoding="utf-8")
          ast.parse(source)
          print("Cadence.py parses clean")

          version = re.search(r'^APP_VERSION = "(.+?)"', source, re.M).group(1)

          # The version lives in three places and nothing else keeps them in step:
          # the program, the Windows version resource, and the changelog.
          resource = pathlib.Path("version.txt").read_text(encoding="utf-8")
          expected = version.replace(".", ", ") + ", 0"
          problems = []
          if f"filevers=({expected})" not in resource:
              problems.append(f"version.txt filevers does not match {version}")
          if f"'{version}.0'" not in resource:
              problems.append(f"version.txt FileVersion/ProductVersion does not match {version}")

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          heads = re.findall(r"^## (\d+\.\d+\.\d+)$", changelog, re.M)
          if not heads or heads[0] != version:
              problems.append(
                  f"CHANGELOG.md should open with '## {version}', found "
                  f"'{heads[0] if heads else 'nothing'}'")

          # Every script chunk has to reach the page, or the app boots into a
          # ReferenceError that no amount of Python testing would catch.
          page = re.search(r"def render_page\(.*?\n\n\n", source, re.S).group(0)
          for chunk in re.findall(r"^(UI_SCRIPT_\w+) = ", source, re.M):
              if chunk not in page:
                  problems.append(f"{chunk} is never added to render_page()")

          if problems:
              print("::error::" + "; ".join(problems))
              sys.exit(1)
          print(f"version {version} agrees across Cadence.py, version.txt and CHANGELOG.md")

      - name: Work out the release tag
        id: meta
        env:
          # One condition, decided once: a tag, a [release] marker in the commit
          # message, or the Republish button.
          PUBLISH: ${{ github.ref_type == 'tag'
            || contains(github.event.head_commit.message, '[release]')
            || inputs.republish }}
        run: |
          v=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' Cadence.py | head -1)
          if [ '${{ github.ref_type }}' = 'tag' ]; then tag='${{ github.ref_name }}'; else tag="cadence-v$v"; fi
          [ "$PUBLISH" = "true" ] && publish=true || publish=false
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"   >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Cadence reports version $v -> release tag $tag (publish: $publish)"

      - name: Compose release notes from the changelog
        shell: python
        env:
          REPO: ${{ github.repository }}
        run: |
          import os, pathlib, re

          # One source of truth. Every release body is built from CHANGELOG.md and
          # links to the release before it, so the set reads as one app's history
          # rather than a pile of separate downloads.
          repo = os.environ["REPO"]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          parts = re.split(r"^## (\d+\.\d+\.\d+)\s*$", text, flags=re.M)[1:]
          entries = list(zip(parts[0::2], parts[1::2]))
          if not entries:
              raise SystemExit("no version sections found in CHANGELOG.md")

          preamble = (
              "Cadence is a music manager for a local library, with an interface "
              "modelled on VS Code. Point it at one folder; it indexes that folder "
              "and everything beneath it on every launch.\n"
          )
          install = "\n".join([
              "### Download",
              "",
              "| File | Platform |",
              "| --- | --- |",
              "| **`Cadence.exe`** | Windows 64-bit |",
              "| **`Cadence-linux-x86_64.tar.gz`** | Linux 64-bit |",
              "| **`Cadence-macos-arm64.tar.gz`** | macOS, Apple silicon |",
              "",
              "All three are self-contained - no Python needed.",
              "",
              "Windows SmartScreen warns on first run unless the executable is",
              "code-signed: choose **More info** then **Run anyway**.",
              "",
              "On macOS and Linux, unpack and run it from a terminal; macOS will ask",
              "you to allow it in **System Settings > Privacy & Security** the first time.",
              "",
              "On first launch it asks for your music folder, or pass it directly:",
              "",
              "```",
              'Cadence.exe --folder "D:\\Music"',
              "./Cadence --folder ~/Music",
              "```",
              "",
              "### From source",
              "",
              "`cadence/Cadence.py` is the whole program - one file, standard library",
              "only, no `pip install`:",
              "",
              "```",
              'python Cadence.py --folder "D:\\Music"',
              "```",
              "",
              "Your audio files are opened read-only unless you edit tags. The index",
              "and playlists live in `%APPDATA%\\Cadence`, `~/.config/cadence` or",
              "`~/Library/Application Support/Cadence` - or beside the program in",
              "portable mode.",
          ])

          out = pathlib.Path("notes")
          out.mkdir(exist_ok=True)
          for index, (version, body) in enumerate(entries):
              tag = "cadence-v" + version
              older = entries[index + 1][0] if index + 1 < len(entries) else None
              chunks = [preamble, "## What changed", body, "---", install]
              if older:
                  chunks.append(
                      "**Full changelog:** [`cadence-v%s...%s`]"
                      "(https://github.com/%s/compare/cadence-v%s...%s)  \n"
                      "**Previous release:** [Cadence %s]"
                      "(https://github.com/%s/releases/tag/cadence-v%s)"
                      % (older, tag, repo, older, tag, older, repo, older))
              else:
                  chunks.append("First release - no earlier version to compare against.")
              chunks.append(
                  "**Every version:** [CHANGELOG.md]"
                  "(https://github.com/%s/blob/%s/cadence/CHANGELOG.md)" % (repo, tag))
              page = "\n\n".join(c.strip() for c in chunks if c.strip()) + "\n"
              (out / (version + ".md")).write_text(page, encoding="utf-8")
              print("composed %s%s" % (tag, " (follows %s)" % older if older else ""))

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: cadence/notes/*.md
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cadence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: pip install --disable-pip-version-check pyinstaller

      - name: Generate the icon
        run: python Cadence.py --write-icon Cadence.ico

      - name: Build the one-file executable
        run: >
          pyinstaller --onefile --noconsole
          --name Cadence
          --icon Cadence.ico
          --add-data "Cadence.ico;."
          --version-file version.txt
          Cadence.py

      # ---- signing -------------------------------------------------------
      # Two routes, both optional, neither one blocking a build. SignPath keeps
      # the key on its own hardware and signs a build it has fetched from this
      # repository, so nothing secret is ever on the runner; a .pfx in the
      # secrets is the route for a certificate held directly. Configure either
      # and builds are signed from then on; configure neither and they publish
      # unsigned, which still runs.

      - name: Upload the unsigned build for SignPath
        id: unsigned
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Cadence-windows-unsigned
          path: cadence/dist/Cadence.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'cadence' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: cadence/dist

      - name: Sign with a certificate of our own
        if: ${{ secrets.SIGNPATH_API_TOKEN == '' && secrets.WINDOWS_CERT_PFX != '' }}
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cadence-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_PFX))
          $url = if ($env:TIMESTAMP_URL) { $env:TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          $kit = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $kit) { throw 'signtool.exe not found on the runner' }
          try {
            # A timestamp keeps the signature valid after the certificate expires.
            & $kit.FullName sign /fd SHA256 /td SHA256 /tr $url `
              /f $pfx /p $env:CERT_PASSWORD dist\Cadence.exe
            if ($LASTEXITCODE -ne 0) { throw "signtool failed with $LASTEXITCODE" }
            Write-Host 'signed'
          } finally {
            Remove-Item $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Report what the signature says
        shell: pwsh
        run: |
          # Whatever route ran, ask Windows itself what it makes of the file.
          $sig = Get-AuthenticodeSignature dist\Cadence.exe
          Write-Host "status:    $($sig.Status)"
          Write-Host "signer:    $($sig.SignerCertificate.Subject)"
          Write-Host "timestamp: $($sig.TimeStamperCertificate.Subject)"
          if ($sig.Status -eq 'NotSigned') {
            Write-Host '::notice::Publishing unsigned - Windows SmartScreen will warn on first run.'
            Write-Host 'To sign, see "Code signing" in cadence/README.md.'
          } elseif ($sig.Status -ne 'Valid') {
            throw "the signature did not verify: $($sig.StatusMessage)"
          } else {
            Write-Host '::notice::Signed and verified.'
          }

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          # --noconsole builds cannot print, so prove it runs by having it emit its icon.
          Start-Process -FilePath dist\Cadence.exe -ArgumentList '--write-png','probe.png' -Wait
          if (-not (Test-Path probe.png)) { throw 'Cadence.exe produced no output' }
          Write-Host "ok: exe ran and wrote $((Get-Item probe.png).Length) bytes"
          Get-Item dist\Cadence.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-windows
          path: |
            cadence/dist/Cadence.exe
            cadence/Cadence.ico
          if-no-files-found: error

  unix:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: macos-latest
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cadence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: pip install --disable-pip-version-check pyinstaller

      - name: Generate the icon
        run: python Cadence.py --write-png Cadence.png

      - name: Build the one-file executable
        # No --noconsole here: on Linux and macOS Cadence is started from a
        # terminal, and its log is the only place problems would show up.
        run: >
          pyinstaller --onefile
          --name Cadence
          --add-data "Cadence.png:."
          Cadence.py

      - name: Smoke-test the executable
        run: |
          ./dist/Cadence --version
          ./dist/Cadence --write-png probe.png
          test -s probe.png || { echo "Cadence produced no output"; exit 1; }
          ls -l dist/Cadence probe.png

      - name: Check it actually serves the library
        run: |
          mkdir -p smoke/Artist/Album
          python - <<'PY'
          import struct, wave
          with wave.open("smoke/Artist/Album/01 - Tone.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(8000)
              w.writeframes(b"".join(struct.pack("<h", 0) for _ in range(8000)))
          PY
          ./dist/Cadence --no-browser --keep-alive --no-watch --port 8790 \
            --folder "$PWD/smoke" > run.log 2>&1 &
          for i in $(seq 1 60); do grep -q 'listening on' run.log && break; sleep 0.5; done
          cat run.log
          token=$(sed -n 's|.*?t=||p' run.log | tr -d '\r')
          [ -n "$token" ] || { echo "server never started"; exit 1; }
          sleep 2
          count=$(curl -sS -H "X-Cadence-Token: $token" \
                    "http://127.0.0.1:8790/api/tracks" | python -c \
                    'import json,sys; print(len(json.load(sys.stdin)["tracks"]))')
          echo "indexed $count track(s)"
          curl -sS -X POST -H "X-Cadence-Token: $token" -H 'Content-Type: application/json' \
            -d '{}' "http://127.0.0.1:8790/api/quit" > /dev/null || true
          [ "$count" = "1" ] || { echo "expected the one test track"; exit 1; }

      - name: Package it
        run: |
          tar -czf "Cadence-${{ matrix.label }}.tar.gz" -C dist Cadence
          ls -l "Cadence-${{ matrix.label }}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: Cadence-${{ matrix.label }}
          path: cadence/Cadence-${{ matrix.label }}.tar.gz
          if-no-files-found: error

  release:
    needs: [check, windows, unix]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads

      - name: Lay the files out
        run: |
          mkdir -p out
          # -unsigned is the copy handed to the signing service; the signed one
          # comes back into Cadence-windows and is the one people download.
          find downloads -type f -not -path '*-unsigned/*' \
            \( -name 'Cadence.exe' -o -name 'Cadence.ico' -o -name '*.tar.gz' \) \
            -exec cp {} out/ \;
          ls -l out

      - name: Clear a stale release for this tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          # A marker-driven release re-points the tag at the commit being built.
          # If a release already carries this tag it may sit on another commit,
          # and an existing tag cannot be moved by the releases API, so drop it.
          if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            echo "removing existing release and tag $TAG"
            gh release delete "$TAG" --yes --cleanup-tag
          else
            echo "no existing release for $TAG"
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Cadence ${{ needs.check.outputs.version }}
          files: out/*
          body_path: downloads/release-notes/${{ needs.check.outputs.version }}.md

      - name: Re-link the earlier releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT: ${{ needs.check.outputs.version }}
        run: |
          # Earlier releases were published before later versions existed, so their
          # notes cannot name what follows. Rewrite them from the same changelog.
          for file in downloads/release-notes/*.md; do
            version=$(basename "$file" .md)
            [ "$version" = "$CURRENT" ] && continue
            tag="cadence-v$version"
            if gh release view "$tag" --json tagName > /dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$file"
              echo "refreshed notes for $tag"
            else
              echo "no release for $tag, skipping"
            fi
          done
